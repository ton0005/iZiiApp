# =============================================================================
#  prj.conf — Cấu hình Zephyr cho bộ điều khiển trục, giai đoạn 1
# =============================================================================
#  Mỗi mục dưới đây đều có lý do liên quan trực tiếp đến tính thời gian thực.
#  Đừng sao chép mù — đọc chú thích, vì vài mục sai sẽ gây lỗi ÂM THẦM.
# =============================================================================

# ---------------------------------------------------------------------------
#  SỐ THỰC — MỤC QUAN TRỌNG NHẤT VÀ DỄ SAI NHẤT
# ---------------------------------------------------------------------------
#  FPU_SHARING BẮT BUỘC khi có TỪ HAI luồng trở lên dùng float.
#  Thiếu nó: thanh ghi FPU không được lưu/khôi phục khi chuyển ngữ cảnh, nên
#  luồng này ghi đè kết quả tính của luồng kia. Hậu quả là số liệu sai NGẪU
#  NHIÊN mà KHÔNG có bất kỳ thông báo lỗi nào — trên hệ điều khiển chuyển
#  động thì đó là chế độ hỏng nguy hiểm.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ---------------------------------------------------------------------------
#  ĐỘ PHÂN GIẢI THỜI GIAN
# ---------------------------------------------------------------------------
#  Mặc định 100 Hz (10 ms/tick) — không thể tạo nhịp 1 ms.
#  10 000 Hz cho độ phân giải 100 µs, đủ cho vòng 1 kHz với dư địa.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_TICKLESS_KERNEL=y

# ---------------------------------------------------------------------------
#  ĐO THỜI GIAN THỰC THI (WCET)
# ---------------------------------------------------------------------------
CONFIG_TIMING_FUNCTIONS=y

# ---------------------------------------------------------------------------
#  BẢO VỆ VÀ THEO DÕI STACK
# ---------------------------------------------------------------------------
#  Tràn stack là nguyên nhân hàng đầu của lỗi "chạy được vài giờ rồi treo".
#  HW_STACK_PROTECTION dùng MPU để bắt tràn NGAY tại thời điểm xảy ra, thay
#  vì để nó âm thầm phá dữ liệu luồng khác rồi sập ở chỗ hoàn toàn khác.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10
CONFIG_THREAD_NAME=y

# ---------------------------------------------------------------------------
#  CẤM CẤP PHÁT ĐỘNG TRONG ĐƯỜNG THỜI GIAN THỰC
# ---------------------------------------------------------------------------
#  Đặt heap = 0 để mọi lời gọi k_malloc thất bại NGAY lúc biên dịch/chạy thử,
#  thay vì lọt vào sản phẩm rồi gây trễ không xác định.
CONFIG_HEAP_MEM_POOL_SIZE=0

# ---------------------------------------------------------------------------
#  GHI LOG — KHÔNG ĐƯỢC CHẶN
# ---------------------------------------------------------------------------
#  Chế độ deferred: LOG_INF chỉ xếp bản tin vào hàng đợi rồi trả về ngay.
#  Việc định dạng và xuất ra UART do luồng log ưu tiên thấp làm.
#  Nếu để chế độ đồng bộ, một dòng LOG_INF trong vòng 1 kHz có thể tốn hàng
#  trăm micro giây và làm trượt deadline.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_PRIORITY=14

# ---------------------------------------------------------------------------
#  KHẲNG ĐỊNH (ASSERT)
# ---------------------------------------------------------------------------
#  Bật trong toàn bộ giai đoạn 1 và 2. Chỉ cân nhắc tắt khi đã có đủ số liệu
#  vận hành — và ngay cả khi đó, hãy nghĩ kỹ.
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# ---------------------------------------------------------------------------
#  GỠ LỖI LỖI NGHIÊM TRỌNG
# ---------------------------------------------------------------------------
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_RESET_ON_FATAL_ERROR=n

# ---------------------------------------------------------------------------
#  WATCHDOG — bắt buộc cho triển khai thật
# ---------------------------------------------------------------------------
CONFIG_WATCHDOG=y

# ---------------------------------------------------------------------------
#  KÍCH THƯỚC / TỐI ƯU
# ---------------------------------------------------------------------------
#  KHÔNG dùng CONFIG_NO_OPTIMIZATIONS trên bản chạy thật: code chưa tối ưu
#  có WCET lớn hơn nhiều và làm phân tích lịch biểu ở mục 4.3 mất giá trị.
CONFIG_SPEED_OPTIMIZATIONS=y

# ---------------------------------------------------------------------------
#  GHI CHÚ CHO native_sim (chạy trên máy tính)
# ---------------------------------------------------------------------------
#  Khi build cho native_sim, TẮT các mục phụ thuộc phần cứng:
#      west build -b native_sim -- -DCONFIG_HW_STACK_PROTECTION=n \
#                                  -DCONFIG_FPU=n -DCONFIG_WATCHDOG=n
#  Xem README.md mục 4 để biết vì sao đây là điểm mạnh lớn nhất của Zephyr
#  đối với dự án này.
