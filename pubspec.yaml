name: izii_app
description: iZiiApp - Community Marketplace & Smart Business Platform
publish_to: 'none'
version: 1.0.4+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^17.2.3

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.30
  sqlite3: ^2.4.6

  # Cache
  shared_preferences: ^2.3.4

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  multicast_dns: ^0.3.3

  # UI
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0

  # File & Media
  image_picker: ^1.1.2
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Auth & Security
  flutter_secure_storage: ^10.3.0
  cryptography: ^2.7.0             # X25519, AES-256-GCM, ED25519, SHA-256

  # Location
  geolocator: ^14.0.2

  # Communication
  url_launcher: ^6.3.1
  share_plus: ^12.0.2
  flutter_blue_plus: ^1.31.0
  ble_peripheral: ^2.4.0
  archive: ^3.6.0


  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  connectivity_plus: ^7.1.1
  collection: ^1.19.0
  google_generative_ai: ^0.4.6
  speech_to_text: ^7.0.0
  permission_handler: ^12.0.2
  mobile_scanner: ^6.0.5
  # Sinh mã QR cho vé mời đăng ký thiết bị (B3)
  qr_flutter: ^4.1.0
  # Đọc/ghi thẻ NFC NDEF cho luồng đăng ký (B4).
  # Lưu ý: chỉ hỗ trợ THẺ, không phải chạm hai điện thoại — Android Beam đã bị
  # gỡ từ Android 14 và iOS chưa bao giờ mở P2P NFC cho app bên thứ ba.
  nfc_manager: ^4.0.2
  nfc_manager_ndef: ^1.0.1
  flutter_webrtc: ^0.12.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  json_serializable: ^6.9.3
  freezed: ^3.2.5
  bloc_test: any
  mocktail: ^1.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false

  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
